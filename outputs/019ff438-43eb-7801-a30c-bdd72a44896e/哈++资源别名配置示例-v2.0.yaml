version: 2.0
target: 0.29j

settings:
  textMode: heredoc
  defaultPosition: center
  defaultMoveCurve: smooth
  caseInsensitive: true

actors:
  Noel:
    raw: n
    display: 诺艾儿
    defaultPos: left
    box: wide
    poses:
      Normal: a_1/a0__F1__f1__m1__b1__u0
      Happy: a_1/a22__F1__f1__m1__b1__u0
      Sad: a_1/a18__F1__f2__m1__b1__u0
    emotes:
      Sweat: SWT
      Surprise: SWT2
    voices:
      Sigh: breath_sleep

  Alma:
    raw: a
    display: 阿尔玛
    defaultPos: right
    box: wide
    poses:
      Normal: alma/default
      Smile: alma/smile

positions:
  left:
    talker: L
    boxPos: L
    from: LT
    x: -240
    y: 0
  center:
    talker: C
    boxPos: C
    from: T
    x: 0
    y: 0
  right:
    talker: R
    boxPos: R
    from: RT
    x: 240
    y: 0
  offleft:
    talker: L_OUT
    boxPos: L
    from: LT
  offright:
    talker: R_OUT
    boxPos: R
    from: RT

boxStyles:
  default: ""
  wide: WIDE
  monologue: MONOLOGUE
  book: BOOK

layers:
  overlay: "#9"
  flash: "#4"
  main: "%W"

layerGroups:
  characters: "T"
  pictures: "#W%"
  all: ""

colors:
  black: BLACK
  dark: DARK
  white: WHITE
  danger: "#cc2233"

curves:
  smooth: ZLINE
  soft: ZSIN
  strong: ZPOW

effects:
  Zoom: ZOOM2
  Burst: BURST

audio:
  sfx:
    Door: door_open_01
    SecretDoor: stone_door_secret
  bgm:
    Forest: BGM_forest
    Museum: BGM_museum

events:
  FarmRule: ___city_farm/_rule
  MuseumInside: ___museum/inside
  SecretRoom: ___museum/secret_room

waiters:
  MapTransfer: MAP_TRANSFER
  ItemDescription: ITEMDESC

shops:
  CityStore: city_shop

cures:
